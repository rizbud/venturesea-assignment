# Local development database. Not used in production (that is a managed Postgres).
#   docker compose up -d db
#   DATABASE_URL=postgres://ledgerlab:ledgerlab@localhost:5432/ledgerlab pnpm --filter @ledgerlab/db migrate:sql
services:
  db:
    image: postgres:16-alpine
    shm_size: 256mb # Docker default 64 MB breaks parallel queries on large ledgers
    environment:
      POSTGRES_USER: ledgerlab
      POSTGRES_PASSWORD: ledgerlab # local only; production credentials come from the platform secret store
      POSTGRES_DB: ledgerlab
    ports:
      - "5432:5432"
    volumes:
      - ledgerlab-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerlab -d ledgerlab"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local AWS emulator for rehearsing the CDK deploy (deployment/aws/README.md).
  #   docker compose --profile localstack up -d localstack
  # Needs LOCALSTACK_AUTH_TOKEN in .env (free account). ECS tasks run as sibling
  # containers through the Docker socket; emulated RDS listens on 4510-4559.
  localstack:
    profiles: [localstack]
    image: localstack/localstack
    ports:
      - "127.0.0.1:4566:4566"
      - "127.0.0.1:4510-4559:4510-4559"
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
    volumes:
      - localstack:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  ledgerlab-db:
  localstack:
