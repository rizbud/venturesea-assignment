# Stand-in for the platform load balancer in docker-compose.prod.yml.
# Docker DNS returns every replica's IP for a service name; nginx round-robins them.
upstream ledger { server ledger-api:4001; }
upstream reporting { server reporting-api:4002; }
upstream web { server web:8080; }

server {
  listen 4001;
  location / {
    proxy_pass http://ledger;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_next_upstream error timeout;
  }
}
server {
  listen 4002;
  location / {
    proxy_pass http://reporting;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
server {
  listen 8080;
  location / { proxy_pass http://web; }
}
