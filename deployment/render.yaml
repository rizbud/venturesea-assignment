# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy with: Render Dashboard -> New -> Blueprint -> point at this repo.
#
# This provisions:
#   - PostgreSQL (managed)
#   - ledger-api    (Docker, public)
#   - reporting-api (Docker, public; calls ledger-api over the private network)
#   - web           (static SPA)
#
# Production shape: 2 instances per API (zero-downtime rolling deploys, no single
# point of failure), migrations as a pre-deploy step from the same image (never on
# boot), health-checked rollout, secrets only from Render's store.
#
# After the first deploy, set the `sync: false` values in the dashboard.

databases:
  - name: ledgerlab-db
    databaseName: ledgerlab
    user: ledgerlab
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  # ---------------------------------------------------------------- ledger API
  - type: web
    name: ledgerlab-ledger-api
    runtime: docker
    plan: starter
    numInstances: 2
    region: singapore
    dockerfilePath: ./deployment/Dockerfile.ledger-api
    dockerContext: .
    healthCheckPath: /health
    # Runs once per deploy, before the new instances take traffic. A failure aborts the deploy.
    preDeployCommand: node dist/migrate.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: LEDGER_API_PORT
        value: 4001
      - key: DATABASE_POOL_MAX
        value: 10 # 2 instances x 10 + migration job stays far below the plan's limit
      # Owner credentials, used only by the preDeployCommand migration.
      - key: MIGRATION_DATABASE_URL
        fromDatabase:
          name: ledgerlab-db
          property: connectionString
      # Runtime credentials for the least-privilege ledgerlab_app role. Create the role
      # once (docs/SECURITY.md, "Database") and paste its URL here; until then the
      # service refuses to start rather than run as the owner silently.
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false # set to your dashboard origin, e.g. https://ledgerlab.example.com
      - key: INTERNAL_API_TOKEN
        generateValue: true

  # ------------------------------------------------------------- reporting API
  - type: web
    name: ledgerlab-reporting-api
    runtime: docker
    plan: starter
    numInstances: 2
    region: singapore
    dockerfilePath: ./deployment/Dockerfile.reporting-api
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: REPORTING_API_PORT
        value: 4002
      # Private-network URL. Render resolves service names inside the region; confirm
      # the exact internal hostname on the ledger service's Connect tab after creation.
      - key: LEDGER_API_URL
        value: http://ledgerlab-ledger-api:4001
      - key: INTERNAL_API_TOKEN
        fromService:
          type: web
          name: ledgerlab-ledger-api
          envVarKey: INTERNAL_API_TOKEN
      - key: CORS_ORIGINS
        sync: false

  # --------------------------------------------------------------- dashboard
  - type: web
    name: ledgerlab-web
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @ledgerlab/web build
    staticPublishPath: ./apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Content-Security-Policy
        # connect-src must list the two API origins once they are known (see VITE_* below).
        value: "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.onrender.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_LEDGER_API_URL
        sync: false # e.g. https://ledgerlab-ledger-api.onrender.com
      - key: VITE_REPORTING_API_URL
        sync: false # e.g. https://ledgerlab-reporting-api.onrender.com
