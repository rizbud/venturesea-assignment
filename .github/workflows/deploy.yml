name: Deploy

# Deploys main to AWS (deployment/aws/deploy.sh). Manual only: Actions → Deploy
# → Run workflow. AWS access is through OIDC: no AWS keys are stored in GitHub.
# Needs the AWS_DEPLOY_ROLE_ARN and DOMAIN variables (deployment/aws/README.md).
on:
  workflow_dispatch:

# One deploy at a time; a newer one waits instead of interrupting a roll.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: deploy to AWS
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4 # version from package.json packageManager

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-3' }}
          role-duration-seconds: 7200

      - name: Deploy
        env:
          DOMAIN: ${{ vars.DOMAIN }}
          REVIEW: ${{ vars.REVIEW }}
        run: deployment/aws/deploy.sh
