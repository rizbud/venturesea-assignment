name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · test · build · ai-log
    runs-on: ubuntu-latest
    # Disposable database so the repository contract suite runs against Postgres too.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ledgerlab
          POSTGRES_PASSWORD: ledgerlab
          POSTGRES_DB: ledgerlab_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ledgerlab -d ledgerlab_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://ledgerlab:ledgerlab@localhost:5432/ledgerlab_test
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The test requires every AI prompt to be logged. This gate enforces it.
      - name: Verify AI prompt log
        run: pnpm ai:verify

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrate test database
        run: pnpm --filter @ledgerlab/db migrate:sql
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Test
        run: pnpm test

      - name: Challenge suite
        run: pnpm --filter @ledgerlab/ledger-api test:challenges

      - name: Build
        run: pnpm build

      - name: Format check
        run: pnpm format:check

  images:
    name: docker images · migrate from image
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ledgerlab
          POSTGRES_PASSWORD: ledgerlab
          POSTGRES_DB: ledgerlab
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ledgerlab -d ledgerlab"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: |
          docker build -f deployment/Dockerfile.ledger-api -t ledgerlab/ledger-api .
          docker build -f deployment/Dockerfile.reporting-api -t ledgerlab/reporting-api .
          docker build -f deployment/Dockerfile.web -t ledgerlab/web .

      # The deploy step exactly as Render's preDeployCommand runs it, inside the runtime image.
      - name: Migrate from the runtime image (twice, to prove idempotency)
        run: |
          for i in 1 2; do
            docker run --rm --network host -e DATABASE_URL=postgres://ledgerlab:ledgerlab@localhost:5432/ledgerlab \
              ledgerlab/ledger-api node dist/migrate.js
          done

      - name: Boot the API image against Postgres and check /health
        run: |
          # Production refuses to boot without these (G5), so pass throwaway values.
          docker run -d --name api --network host -e NODE_ENV=production \
            -e CORS_ORIGINS=https://ci.invalid -e INTERNAL_API_TOKEN="$(openssl rand -hex 32)" \
            -e DATABASE_URL=postgres://ledgerlab:ledgerlab@localhost:5432/ledgerlab ledgerlab/ledger-api
          for i in $(seq 1 20); do curl -fs localhost:4001/health && exit 0; sleep 1; done
          docker logs api; exit 1
