name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · test · build · ai-log
    runs-on: ubuntu-latest
    # Disposable database so the repository contract suite runs against Postgres too.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ledgerlab
          POSTGRES_PASSWORD: ledgerlab
          POSTGRES_DB: ledgerlab_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ledgerlab -d ledgerlab_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://ledgerlab:ledgerlab@localhost:5432/ledgerlab_test
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The test requires every AI prompt to be logged. This gate enforces it.
      - name: Verify AI prompt log
        run: pnpm ai:verify

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrate test database
        run: pnpm --filter @ledgerlab/db migrate:sql
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Test
        run: pnpm test

      - name: Challenge suite
        run: pnpm --filter @ledgerlab/ledger-api test:challenges

      - name: Build
        run: pnpm build

      - name: Format check
        run: pnpm format:check
